<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Codebase scan</title>
  <style>
    :root{
      color-scheme:light;
      --paper:#fafaf9;--grid:rgba(20,20,20,.04);--ink:#18181b;--ink-2:#52525b;--muted:#8e8e93;--faint:#b4b4b8;
      --surface:#ffffff;--surface-2:#f4f4f3;--surface-3:#ececea;--line:rgba(20,20,20,.09);--line-2:rgba(20,20,20,.14);
      --edge:#d4d4d1;--edge-active:#9b9b97;--label-bg:rgba(250,250,249,.96);--shadow:0 12px 30px rgba(20,20,20,.07),0 1px 2px rgba(20,20,20,.03);
      --entry:#64748b;--cron:#f59e0b;--agent:#f97316;--model:#3b82f6;--tool:#8b5cf6;--service:#ec4899;--store:#10b981;--external:#0ea5e9;
      --workflow:#10b981;--added:#16a34a;--removed:#dc2626;--changed:#d97706;--chip-mix:white;
    }
    :root[data-theme="dark"]{
      color-scheme:dark;
      --paper:#0e0e10;--grid:rgba(255,255,255,.035);--ink:#f4f4f5;--ink-2:#c4c4cc;--muted:#8b8b94;--faint:#5c5c66;
      --surface:#18181b;--surface-2:#222226;--surface-3:#2b2b30;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
      --edge:#3b3b42;--edge-active:#8b8b94;--label-bg:rgba(14,14,16,.94);--shadow:0 14px 34px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
      --entry:#94a3b8;--chip-mix:#18181b;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        color-scheme:dark;
        --paper:#0e0e10;--grid:rgba(255,255,255,.035);--ink:#f4f4f5;--ink-2:#c4c4cc;--muted:#8b8b94;--faint:#5c5c66;
        --surface:#18181b;--surface-2:#222226;--surface-3:#2b2b30;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
        --edge:#3b3b42;--edge-active:#8b8b94;--label-bg:rgba(14,14,16,.94);--shadow:0 14px 34px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
        --entry:#94a3b8;--chip-mix:#18181b;
      }
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      color:var(--ink);background-color:var(--paper);
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:72px 72px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;user-select:none
    }
    button,input{font:inherit;color:inherit}
    svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    #viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
    #viewport.dragging{cursor:grabbing}
    #stage{position:absolute;left:0;top:0;transform-origin:0 0}
    #stage.moving{will-change:transform}
    #edges,#groups,#nodes{position:absolute;left:0;top:0}
    #groups{z-index:1;pointer-events:none}
    #edges{z-index:2;overflow:visible;pointer-events:none}
    #nodes{z-index:3}

    /* groups */
    .group{position:absolute;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--surface) 88%,transparent);
      box-shadow:0 8px 26px rgba(20,20,20,.035);opacity:0;animation:fade-in .6s cubic-bezier(.22,1,.36,1) forwards;transition:opacity .2s,filter .2s,border-color .2s}
    .group-title{position:absolute;top:16px;left:18px;right:18px;display:flex;align-items:center;gap:7px;overflow:hidden;color:var(--muted);
      font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis}
    .group.workflow{border-color:color-mix(in srgb,var(--workflow) 34%,var(--line));background:color-mix(in srgb,var(--workflow) 4%,var(--surface))}
    .group.workflow .group-title{color:var(--workflow);font-size:11px;letter-spacing:0;text-transform:none}
    .group.dimmed{opacity:.18!important}
    .group.filtered{opacity:.1!important;filter:grayscale(1)}
    .group.hit,.node.hit{box-shadow:0 0 0 3px color-mix(in srgb,var(--hit,#888) 30%,transparent),0 8px 24px rgba(18,18,18,.08)}

    /* nodes */
    .node{--kind:var(--entry);position:absolute;display:flex;flex-direction:column;padding:0;border:1px solid var(--line-2);border-radius:18px;
      background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,20,.03);cursor:pointer;outline:none;text-align:left;
      opacity:0;transform:translateY(8px) scale(.98);animation:node-in .55s cubic-bezier(.22,1,.36,1) forwards;
      transition:opacity .2s,border-color .18s,box-shadow .25s,transform .18s,filter .2s}
    .node:hover,.node:focus-visible{border-color:color-mix(in srgb,var(--kind) 45%,var(--line-2));box-shadow:0 7px 20px rgba(18,18,18,.09);transform:translateY(-2px)}
    .node.selected{border-color:color-mix(in srgb,var(--kind) 70%,var(--line-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--kind) 14%,transparent),0 8px 24px rgba(18,18,18,.08)}
    .node.low{border-style:dashed}
    .node.dimmed{opacity:.12!important}
    .node.filtered{opacity:.05!important;filter:grayscale(1);pointer-events:none}
    .node[data-kind="cron"]{--kind:var(--cron)}.node[data-kind="agent"]{--kind:var(--agent)}.node[data-kind="model"]{--kind:var(--model)}
    .node[data-kind="tool"]{--kind:var(--tool)}.node[data-kind="service"]{--kind:var(--service)}.node[data-kind="store"]{--kind:var(--store)}
    .node[data-kind="external"]{--kind:var(--external)}
    .node-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:9px;min-height:62px;padding:10px 12px 10px 11px}
    .node-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:var(--kind);
      background:color-mix(in srgb,var(--kind) 12%,var(--chip-mix));font-size:15px}
    .node-copy{min-width:0}
    .node-label{display:block;overflow:hidden;font-size:13px;font-weight:650;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
    .node-sub{display:block;overflow:hidden;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
    .badge{padding:2px 6px;border-radius:8px;font-size:8.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}
    .badge.added{color:var(--added);background:color-mix(in srgb,var(--added) 12%,var(--chip-mix))}
    .badge.changed{color:var(--changed);background:color-mix(in srgb,var(--changed) 12%,var(--chip-mix))}
    .embeds{display:flex;flex-direction:column;gap:8px;margin:0 10px;padding:10px 2px;border-top:1px solid var(--line)}
    .embed{display:flex;align-items:center;gap:7px;height:16px;min-width:0;color:var(--ink-2);font-size:10.5px;font-weight:550}
    .embed span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .embed .ek{margin-left:auto;color:var(--faint);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .mono{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:5px;color:#fff;background:hsl(var(--h,220) 55% 52%);
      font-size:9px;font-weight:800;line-height:1}
    .kdot{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--chip-mix));font-size:10px}
    .node.beam::before{content:"";position:absolute;inset:-1px;padding:1.5px;border-radius:inherit;pointer-events:none;
      background:conic-gradient(from var(--a,0deg),transparent 0 70%,color-mix(in srgb,var(--agent) 85%,transparent) 82%,#facc15 88%,transparent 96%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
      opacity:0;animation:beam-in 1.2s var(--beam-delay,1.4s) ease forwards,spin 6s var(--beam-phase,0s) linear infinite}
    @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}

    /* edges */
    .edge{fill:none;stroke:var(--edge);stroke-width:1.2;transition:opacity .2s,stroke .2s}
    .edge.active{stroke:var(--edge-active);stroke-width:1.6}
    .edge.dimmed,.arrow.dimmed,.elabel.dimmed{opacity:.08}
    .edge.filtered,.arrow.filtered,.elabel.filtered{opacity:0}
    .arrow{fill:none;stroke:var(--edge);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
    .arrow.active{stroke:var(--edge-active)}
    .elabel{opacity:0;animation:fade-in .4s ease forwards}
    .elabel rect{fill:var(--label-bg);stroke:var(--line)}
    .elabel text{fill:var(--muted);font-size:10px;font-weight:550;text-anchor:middle;dominant-baseline:central}
    .elabel.kind{display:none}.elabel.kind.show{display:inline}
    .elabel.kind text{fill:var(--faint);font-style:italic}
    .beam-dot{filter:drop-shadow(0 0 4px currentColor)}

    /* chrome */
    .panel{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    #rail{position:fixed;z-index:20;top:16px;left:16px;bottom:16px;width:268px;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;
      animation:chrome-in .7s cubic-bezier(.22,1,.36,1) both;transition:transform .25s ease,opacity .25s}
    #rail-scroll{flex:1;overflow:auto;padding:22px 22px 26px;scrollbar-width:none}
    #rail-scroll::-webkit-scrollbar{display:none}
    .proj{display:flex;gap:11px;align-items:flex-start}
    .proj-mark{width:34px;height:34px;border-radius:11px;font-size:15px}
    .proj-name{margin:0;overflow:hidden;font-size:15px;font-weight:700;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
    .proj-tag{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.4}
    .proj-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--faint);font-size:10px}
    .persona{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:12px;color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--chip-mix));font-size:10.5px;font-weight:650}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
    .stat{padding:10px 12px;border-radius:14px;background:var(--surface-2)}
    .stat b{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
    .stat span{color:var(--muted);font-size:10px;font-weight:600}
    .stat i{margin-left:5px;font-style:normal;font-size:10px;font-weight:700}
    .stat i.up{color:var(--added)}.stat i.down{color:var(--removed)}
    .sec{margin-top:24px}
    .sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    .sec-title small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint)}
    .list{display:grid;gap:3px;margin:0;padding:0;list-style:none}
    .row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;margin:0 -8px;width:calc(100% + 16px);border:0;border-radius:10px;background:none;
      color:var(--ink);font-size:12.5px;font-weight:580;text-align:left;cursor:pointer}
    .row:hover,.row:focus-visible{background:var(--surface-2);outline:none}
    .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .count{color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
    .row.none{color:var(--faint);cursor:default}.row.none:hover{background:none}
    .chips{display:flex;flex-wrap:wrap;gap:5px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink-2);font-size:10.5px;font-weight:560;cursor:pointer}
    .chip:hover{border-color:var(--line-2);background:var(--surface-2)}
    .chip b{color:var(--faint);font-weight:600}
    .changes{padding:13px 14px;border:1px solid color-mix(in srgb,var(--changed) 25%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--changed) 5%,var(--surface))}
    .changes .sec-title{margin-bottom:8px}
    .delta-line{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:11.5px;line-height:1.35}
    .delta-line .sym{width:10px;flex:none;font-weight:800}
    .sym.add{color:var(--added)}.sym.rem{color:var(--removed)}.sym.chg{color:var(--changed)}
    .delta-line .muted{color:var(--faint);font-size:10px}
    .linkbtn{margin-top:8px;padding:6px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:11px;font-weight:600;cursor:pointer}
    .linkbtn[aria-pressed="true"]{border-color:var(--changed);color:var(--changed)}
    details.notes{margin-top:22px;color:var(--muted);font-size:11px}
    details.notes summary{cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    details.notes li{margin:7px 0;line-height:1.4}
    .privacy{margin-top:22px;color:var(--faint);font-size:10px;line-height:1.45}

    #toolbar{position:fixed;z-index:20;top:16px;right:16px;display:flex;align-items:center;gap:4px;padding:5px;border-radius:18px;animation:chrome-in .7s .05s cubic-bezier(.22,1,.36,1) both}
    #search{width:210px;height:32px;padding:0 10px 0 30px;border:0;border-radius:12px;background:var(--surface-2);font-size:12px;outline:none}
    #search:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--model) 35%,transparent)}
    .search-wrap{position:relative;display:flex;align-items:center}
    .search-wrap svg{position:absolute;left:10px;color:var(--muted);font-size:13px}
    .tbtn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:11px;background:none;color:var(--ink-2);font-size:15px;cursor:pointer}
    .tbtn:hover{background:var(--surface-2);color:var(--ink)}
    #search-count{position:absolute;right:9px;color:var(--faint);font-size:10px;pointer-events:none}
    #rail-toggle{display:none}

    #legend{position:fixed;z-index:20;left:50%;bottom:16px;display:flex;align-items:center;gap:2px;max-width:calc(100vw - 32px);padding:6px 8px;overflow-x:auto;
      border-radius:24px;transform:translateX(-50%);scrollbar-width:none;animation:legend-in .75s .1s cubic-bezier(.22,1,.36,1) both}
    #legend::-webkit-scrollbar{display:none}
    .lg{--c:#777;display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:0;border-radius:16px;background:transparent;color:var(--muted);
      font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:color .18s,background .18s,opacity .18s}
    .lg:hover{color:var(--ink);background:var(--surface-2)}
    .lg.off{opacity:.3}
    .lg svg{color:var(--c);font-size:13px}
    .lg .n{min-width:17px;padding:2px 5px;border-radius:9px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--chip-mix));font-size:9px;text-align:center}

    #detail{position:fixed;z-index:21;top:68px;right:16px;width:316px;max-height:calc(100vh - 150px);overflow:auto;padding:20px;border-radius:24px;
      opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;scrollbar-width:thin;user-select:text}
    #detail.open{opacity:1;transform:none;pointer-events:auto}
    #detail-close{position:absolute;top:12px;right:12px}
    .d-kind{display:flex;align-items:center;gap:7px;color:var(--c);font-size:10px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
    .d-title{margin:8px 34px 3px 0;font-size:17px;line-height:1.25}
    .d-sub{margin:0;color:var(--muted);font-size:11.5px}
    .d-copy{margin:12px 0 0;color:var(--ink-2);font-size:12px;line-height:1.55}
    .d-ref{display:flex;align-items:center;gap:6px;margin-top:12px;padding:7px 8px 7px 10px;border-radius:10px;background:var(--surface-2)}
    .d-ref code{flex:1;min-width:0;overflow:hidden;color:var(--ink-2);font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;text-overflow:ellipsis;white-space:nowrap}
    .d-ref button{padding:3px 7px;border:0;border-radius:7px;background:var(--surface);color:var(--muted);font-size:10px;cursor:pointer}
    .d-sec{margin-top:16px}
    .d-sec h4{margin:0 0 7px;color:var(--muted);font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}
    .seg{display:inline-flex;margin-top:14px;padding:3px;border-radius:11px;background:var(--surface-2)}
    .seg button{padding:5px 10px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
    .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .conn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin:0 -8px;width:calc(100% + 16px);border:0;border-radius:9px;background:none;font-size:12px;text-align:left;cursor:pointer}
    .conn:hover{background:var(--surface-2)}
    .conn .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .conn .how{color:var(--faint);font-size:10px;white-space:nowrap}
    .conf{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle}
    .conf.low{color:var(--changed)}

    #empty{position:fixed;z-index:10;top:50%;left:50%;display:none;padding:18px 22px;border-radius:18px;color:var(--muted);transform:translate(-50%,-50%)}
    #hint{position:fixed;z-index:19;right:16px;bottom:20px;color:var(--faint);font-size:10px;pointer-events:none}

    @keyframes node-in{to{opacity:1;transform:none}}
    @keyframes fade-in{to{opacity:1}}
    @keyframes beam-in{to{opacity:.85}}
    @keyframes spin{to{--a:360deg}}
    @keyframes chrome-in{from{opacity:0;transform:translateY(8px)}}
    @keyframes legend-in{from{opacity:0;transform:translate(-50%,8px)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
    @media (max-width:760px){
      #rail{top:auto;bottom:74px;left:12px;right:12px;width:auto;max-height:58vh;transform:translateY(calc(100% + 90px));opacity:0}
      body.rail-open #rail{transform:none;opacity:1}
      #rail-toggle{display:grid}
      #toolbar{left:12px;right:12px;top:12px}
      #search{width:100%}.search-wrap{flex:1}
      #detail{top:auto;right:12px;bottom:74px;left:12px;width:auto;max-height:52vh}
      .lg{padding:7px 7px}.lg .t{display:none}
      #hint{display:none}
    }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Interactive codebase map">
    <div id="stage"><svg id="edges" aria-hidden="true"></svg><div id="groups"></div><div id="nodes"></div></div>
  </div>
  <aside id="rail" class="panel" aria-label="Codebase inventory"><div id="rail-scroll"></div></aside>
  <div id="toolbar" class="panel" role="toolbar" aria-label="Map controls"></div>
  <nav id="legend" class="panel" aria-label="Node categories"></nav>
  <aside id="detail" class="panel" aria-live="polite"></aside>
  <div id="empty" class="panel">No architectural components were mapped.</div>
  <div id="hint">drag to pan · ⌘/ctrl + scroll to zoom · / search · F fit · Esc clear</div>
  <script>__ELKJS__</script>
  <script>
  "use strict";
  (() => {
    // ── offline guard: this page never talks to the network ─────────────────
    const deny=()=>{throw new Error("Network access is disabled in this offline codebase map.")};
    for(const name of ["fetch","XMLHttpRequest","WebSocket","EventSource","RTCPeerConnection","WebTransport"]){
      try{Object.defineProperty(globalThis,name,{value:name==="fetch"?deny:class{constructor(){deny()}},writable:false,configurable:false})}catch(_){}
    }
    try{if(globalThis.navigator&&navigator.sendBeacon)Object.defineProperty(navigator,"sendBeacon",{value:deny,configurable:false})}catch(_){}

    const PAYLOAD=__SCAN_MAP_JSON__;
    const RAW=PAYLOAD.scan,DIFF=PAYLOAD.diff,AUDIT=PAYLOAD.audit||[];
    const WORKFLOWS=(RAW.workflows||[]).map(s=>s.toLowerCase());
    const NS="http://www.w3.org/2000/svg";
    const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ── icons (static, outline) ─────────────────────────────────────────────
    const ICON={
      entry:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
      cron:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

    function toggleTheme(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("scan-codebase-theme",r.dataset.theme)}catch(_){}}
    try{const saved=localStorage.getItem("scan-codebase-theme");if(saved==="dark"||saved==="light")document.documentElement.dataset.theme=saved}catch(_){}

    // ── traveling beams: sparse dots that run an edge and flash its target ──
    function beamTick(){
      if(REDUCED||document.hidden||!edgeEls.length)return;
      const pool=edgeEls.filter(x=>x.live&&(!trace||x.traced));if(!pool.length)return;
      if(!trace&&Math.random()<.35)return;
      const x=pool[Math.floor(Math.random()*pool.length)],src=byId.get(x.from),grp=x.from.startsWith("group:")?info.groups[Number(x.from.slice(6))]:null;
      const color=src?KIND[src.kind].color:(grp&&grp.workflow?"var(--workflow)":"var(--edge-active)");
      const dur=clamp(x.len/240,.7,3.4),dot=sv("circle",{r:3.2,class:"beam-dot",style:`fill:${color};color:${color}`});
      const anim=sv("animateMotion",{dur:dur+"s",path:x.path.getAttribute("d"),fill:"freeze",begin:"indefinite",calcMode:"spline",keyTimes:"0;1",keySplines:".4 0 .2 1"});
      dot.append(anim);svg.append(dot);try{anim.beginElement()}catch(_){dot.remove();return}
      setTimeout(()=>{dot.remove();const target=x.to.startsWith("group:")?groupEls.get(info.groups[Number(x.to.slice(6))].label):nodeEls.get(x.to);
        if(target){target.style.setProperty("--hit",color);target.classList.add("hit");setTimeout(()=>target.classList.remove("hit"),520)}},dur*1000);
    }

    // ── boot ────────────────────────────────────────────────────────────────
    async function relayout(dir){
      direction=dir;select(null);info=await layoutGraph(direction);renderMap();fit(false);
    }
    document.title=`${RAW.project.name} · codebase scan`;
    buildToolbar();buildLegend();
    const portrait=innerWidth<=760&&innerHeight>innerWidth;
    relayout(portrait?"DOWN":"RIGHT").then(()=>{
      buildRail();fit(false);
      document.getElementById("empty").style.display=nodes.length?"none":"block";
      setInterval(beamTick,650);
    }).catch(err=>{console.error(err);const e=document.getElementById("empty");e.textContent="The local map layout could not be created.";e.style.display="block"});
  })();
  </script>
</body>
